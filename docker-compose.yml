services:
  manager:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        APP_COMMIT: ${APP_COMMIT:-unknown}
    restart: unless-stopped
    # Localhost-only unless MANAGER_BIND says otherwise: the manager speaks
    # plain HTTP and holds the Docker socket, so it shouldn't be on a LAN or
    # public interface without TLS/VPN in front (see .env.example).
    ports:
      - "${MANAGER_BIND:-127.0.0.1}:${MANAGER_PORT:-8080}:8080"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-immediately}
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-insecure-secret}
      BASE_DOMAIN: ${BASE_DOMAIN:-mc.example.com}
      MANAGER_PORT: 8080
      DATA_DIR: /app/data
      LOGS_DIR: /app/logs
      INFRARED_CONFIG_DIR: /app/infrared-configs
      DOCKER_NETWORK: mc-net
      MC_IMAGE: ${MC_IMAGE:-itzg/minecraft-server:stable}
      IMPORT_MAX_BYTES: ${IMPORT_MAX_BYTES:-68719476736}
      CF_API_KEY: ${CF_API_KEY:-}
      CF_API_BASE_URL: ${CF_API_BASE_URL:-https://api.curseforge.com}
      PACK_UPDATE_CHECK_HOURS: ${PACK_UPDATE_CHECK_HOURS:-6}
      TRUST_PROXY: ${TRUST_PROXY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - manager-data:/app/data
      - ./logs:/app/logs
      - ./infrared/configs:/app/infrared-configs
    networks:
      - mc-net

  # Pinned to the last v1.x release deliberately: it's the version with
  # confirmed fsnotify-based hot-reload of its config folder (no restart
  # needed when the manager adds/removes a route). The current v2 branch is
  # alpha-tagged, uses a different config schema, and — as verified against
  # its source during implementation — does not hot-reload at all.
  infrared:
    image: haveachin/infrared:1.3.4
    restart: unless-stopped
    ports:
      - "25565:25565"
    environment:
      INFRARED_CONFIG_PATH: /configs
    volumes:
      - ./infrared/configs:/configs
    networks:
      - mc-net

networks:
  mc-net:
    name: mc-net

volumes:
  manager-data:
